name: phab-gepg

x-app: &app
  image: phab-gepg:local
  env_file:
    - path: .env
      required: true
  environment:
    # Container networking overrides; everything else comes from .env.
    DB_CONNECTION: pgsql
    DB_HOST: db
    DB_PORT: 5432
    QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
  volumes:
    # GePG signing keys, mounted read-only (never baked into the image).
    - ${GEPG_KEYS_DIR:-./docker/keys}:/opt/keys:ro
    - app-storage:/var/www/html/storage/app
    - app-logs:/var/www/html/storage/logs
  restart: unless-stopped

services:
  app:
    <<: *app
    build:
      context: .
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      RUN_SEEDERS: ${RUN_SEEDERS:-false}
    ports:
      - "${APP_PORT:-8304}:8080"
    depends_on:
      db:
        condition: service_healthy

  queue:
    <<: *app
    command: >-
      php artisan queue:work
      --queue=${GEPG_OUTBOUND_QUEUE:-gepg-outbound},${GEPG_CONTROL_INBOX_QUEUE:-gepg-inbox-control},${GEPG_PAYMENT_INBOX_QUEUE:-gepg-inbox-payment},default
      --sleep=3 --max-time=3600
    healthcheck:
      disable: true
    pull_policy: never
    depends_on:
      app:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-ttpb}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    # Not published to the host. For local DB access, add e.g.:
    # ports: ["127.0.0.1:5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  db-data:
  app-storage:
  app-logs:
